# Antes de cada commit, só nos arquivos alterados (leve; a suíte inteira roda no CI e pelo heavy).
pre-commit:
  parallel: true
  jobs:
    - name: prettier
      glob: '*.{ts,tsx,js,mjs,json,yml,yaml}'
      exclude: ['docs/**', 'legado/**', 'pnpm-lock.yaml']
      run: pnpm prettier --check {staged_files}
    - name: eslint
      glob: '*.{ts,tsx}'
      run: pnpm eslint --max-warnings=0 --no-warn-ignored {staged_files}
    - name: gitleaks
      # Achou segredo = commit barrado. Sem o binário instalado, avisa e o CI barra.
      run: if command -v gitleaks >/dev/null; then gitleaks protect --staged --redact --no-banner; else echo "gitleaks ausente aqui; o CI barra"; fi
    - name: knip
      # Exportação, arquivo ou dependência sem uso: barra aqui em vez de falhar no CI.
      glob: '*.{ts,tsx,json}'
      run: pnpm knip --no-progress
